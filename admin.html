<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JT Try-on Admin</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0e0e0e;color:#F8F5F0}
.wrap{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:8px 0}
.note{color:#B8A48A;font-size:13px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
.card{background:#141414;border:1px solid #2a2a2a;border-radius:12px;padding:14px}
.card h2{font-size:14px;margin:0 0 10px;color:#B8A48A}
.row{display:flex;align-items:center;gap:10px;margin:8px 0}
label{flex:1;font-size:13px}
input[type=range]{width:140px;accent-color:#B8A48A}
input[type=number]{width:70px;background:#1c1c1c;border:1px solid #333;color:#fff;border-radius:6px;padding:4px}
input[type=text]{width:100%;background:#1c1c1c;border:1px solid #333;color:#fff;border-radius:6px;padding:8px}
button{background:#B8A48A;color:#111;border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer;margin-right:8px}
button.ghost{background:transparent;color:#F8F5F0;border:1px solid #333}
.preview{font-size:12px;color:#9a9690;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <p class="note">外框比例锁定 <strong>136:208</strong>（与 Kids / 全息舱一致）。保存后刷新顾客页生效。</p>
  <h1>JT 试衣 布局后台</h1>
  <div class="grid">
    <div class="card">
      <h2>舱体 / 模块尺寸</h2>
      <div class="row"><label>舱预览宽度 px</label>
        <input type="range" id="cabin_max_width_px" min="360" max="720" value="560" />
        <input type="number" id="cabin_max_width_px_n" min="360" max="720" value="560" /></div>
      <div class="row"><label>左栏宽度 %</label>
        <input type="range" id="left_column_percent" min="28" max="45" value="34" />
        <input type="number" id="left_column_percent_n" min="28" max="45" value="34" /></div>
      <div class="row"><label>主推区高度 px</label>
        <input type="range" id="zone2_featured_max_px" min="100" max="240" value="150" />
        <input type="number" id="zone2_featured_max_px_n" min="100" max="240" value="150" /></div>
      <div class="row"><label>底部空白 %</label>
        <input type="range" id="zone_empty_percent" min="0" max="16" value="4" />
        <input type="number" id="zone_empty_percent_n" min="0" max="16" value="4" /></div>
      <div class="preview" id="preview-line">-</div>
    </div>
    <div class="card">
      <h2>显示 / 主推 ID</h2>
      <div class="row"><input type="checkbox" id="show_featured" checked /><label>显示主推</label></div>
      <div class="row"><input type="checkbox" id="show_shortlist" checked /><label>显示备选</label></div>
      <div class="row"><input type="checkbox" id="attract_enabled" checked /><label>启用吸引视频</label></div>
      <div class="row"><input type="checkbox" id="attract_auto_enter" checked /><label>有人自动进入</label></div>
      <label style="font-size:12px;color:#9a9690">主推 ID（逗号分隔）</label>
      <input type="text" id="featured_ids" value="01,09,11,17" />
      <div class="row" style="margin-top:10px"><label>默认语言</label>
        <select id="default_lang" style="background:#1c1c1c;color:#fff;border:1px solid #333;padding:6px;border-radius:6px">
          <option value="zh">中文</option><option value="en">EN</option>
        </select></div>
    </div>
    <div class="card">
      <h2>计时</h2>
      <div class="row"><label>停留进入秒</label>
        <input type="range" id="attract_dwell_seconds" min="2" max="20" value="5" />
        <input type="number" id="attract_dwell_seconds_n" min="2" max="20" value="5" /></div>
      <div class="row"><label>无人回吸引秒</label>
        <input type="range" id="attract_idle_seconds" min="15" max="180" value="90" />
        <input type="number" id="attract_idle_seconds_n" min="15" max="180" value="90" /></div>
      <div class="row"><label>结束保留秒</label>
        <input type="range" id="end_hold_seconds" min="5" max="40" value="18" />
        <input type="number" id="end_hold_seconds_n" min="5" max="40" value="18" /></div>
      <div class="row"><label>离场轮播秒</label>
        <input type="range" id="exit_carousel_seconds" min="2" max="10" value="4" />
        <input type="number" id="exit_carousel_seconds_n" min="2" max="10" value="4" /></div>
    </div>
  </div>
  <div style="margin-top:16px">
    <button type="button" id="btn-save">保存并应用</button>
    <button type="button" id="btn-reset" class="ghost">恢复默认</button>
    <a href="./" style="color:#B8A48A;margin-left:12px">打开顾客页</a>
  </div>
</div>
<script>
const $ = (s) => document.querySelector(s);
const KEYS = [
  "cabin_max_width_px","left_column_percent","zone2_featured_max_px","zone_empty_percent",
  "attract_dwell_seconds","attract_idle_seconds","end_hold_seconds","exit_carousel_seconds"
];
const DEFAULTS = {
  cabin_max_width_px: 560,
  left_column_percent: 34,
  zone2_featured_max_px: 150,
  zone_empty_percent: 4,
  end_hold_seconds: 18,
  featured_ids: ["01","09","11","17"],
  default_lang: "zh",
  show_featured: true,
  show_shortlist: true,
  attract_enabled: true,
  attract_auto_enter: true,
  attract_dwell_seconds: 5,
  attract_idle_seconds: 90,
  exit_carousel_seconds: 4
};
function syncPair(id) {
  const r = document.getElementById(id);
  const n = document.getElementById(id + "_n");
  if (!r || !n) return;
  r.oninput = () => { n.value = r.value; updatePreview(); live(); };
  n.oninput = () => { r.value = n.value; updatePreview(); live(); };
}
function readLayout() {
  const ids = ($("#featured_ids").value || "").split(/[,\uFF0C\s]+/).filter(Boolean);
  const L = {
    cabin_max_width_px: Number($("#cabin_max_width_px").value) || 560,
    left_column_percent: Number($("#left_column_percent").value) || 34,
    zone2_featured_max_px: Number($("#zone2_featured_max_px").value) || 150,
    zone_empty_percent: Number($("#zone_empty_percent").value) || 4,
    featured_ids: ids,
    default_lang: $("#default_lang").value || "zh",
    show_featured: $("#show_featured").checked,
    show_shortlist: $("#show_shortlist").checked,
    attract_enabled: $("#attract_enabled").checked,
    attract_auto_enter: $("#attract_auto_enter").checked,
    attract_dwell_seconds: Number($("#attract_dwell_seconds").value) || 5,
    attract_idle_seconds: Number($("#attract_idle_seconds").value) || 90,
    end_hold_seconds: Number($("#end_hold_seconds").value) || 18,
    exit_carousel_seconds: Number($("#exit_carousel_seconds").value) || 4,
    cabin_aspect_w: 136,
    cabin_aspect_h: 208
  };
  return L;
}
function applyToForm(L) {
  const set = (id, v) => {
    const r = document.getElementById(id);
    const n = document.getElementById(id + "_n");
    if (r) r.value = v;
    if (n) n.value = v;
  };
  KEYS.forEach((k) => { if (L[k] != null) set(k, L[k]); });
  if (L.featured_ids) $("#featured_ids").value = Array.isArray(L.featured_ids) ? L.featured_ids.join(",") : String(L.featured_ids);
  if (L.default_lang) $("#default_lang").value = L.default_lang;
  ["show_featured","show_shortlist","attract_enabled","attract_auto_enter"].forEach((id) => {
    if (typeof L[id] === "boolean") document.getElementById(id).checked = L[id];
  });
  updatePreview();
}
function updatePreview() {
  const d = readLayout();
  $("#preview-line").textContent = `宽 ${d.cabin_max_width_px} · 左 ${d.left_column_percent}% · 主推高 ${d.zone2_featured_max_px} · 比例 136:208`;
}
function live() {
  const L = readLayout();
  try {
    const w = window.opener;
    if (w) w.postMessage({ type: "jt-layout-live", layout: L }, "*");
  } catch (_) {}
}
function save() {
  const L = readLayout();
  localStorage.setItem("jt_layout_deployed", JSON.stringify(L));
  live();
  alert("已保存。请刷新顾客页（同一浏览器）。");
}
function load() {
  try {
    const raw = localStorage.getItem("jt_layout_deployed");
    if (raw) applyToForm(JSON.parse(raw));
    else applyToForm(DEFAULTS);
  } catch (_) { applyToForm(DEFAULTS); }
}
KEYS.forEach(syncPair);
["show_featured","show_shortlist","attract_enabled","attract_auto_enter","featured_ids","default_lang"].forEach((id) => {
  const el = document.getElementById(id);
  if (el) el.onchange = () => { updatePreview(); live(); };
});
$("#btn-save").onclick = save;
$("#btn-reset").onclick = () => { applyToForm(DEFAULTS); save(); };
load();
</script>
</body>
</html>

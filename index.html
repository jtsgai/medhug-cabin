<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JT 试衣舱</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./cabin-aspect.css" />
  <link rel="stylesheet" href="./cabin-tryon-lock.css" />
  <link rel="stylesheet" href="./tryon-scroll.css" />
  <link rel="stylesheet" href="./shared-dock.css" />
  <link rel="stylesheet" href="./ui-over-video.css?v=cam5" />
</head>
<body>
  <video id="video-output" autoplay playsinline muted></video>
  <div id="error-banner" class="error-banner"></div>
  <div id="toast" class="toast hidden"></div>
  <nav class="jt-dock" id="jt-dock">
    <a href="./index.html" class="is-here">TRY ON</a>
    <a href="./kids/">KIDS</a>
    <a href="./fx/">FX</a>
    <a href="./stage/">STAGE</a>
  </nav>
  <div class="cabin-stage">
    <div id="attract-layer" class="attract-layer hidden">
      <video id="attract-video" muted playsinline></video>
    </div>
    <div id="exit-carousel" class="exit-carousel hidden">
      <div class="exit-carousel-inner">
        <img id="exit-carousel-img" alt="" />
        <div id="exit-carousel-caption" class="exit-carousel-caption"></div>
      </div>
    </div>
    <div class="cabin">
      <aside id="left-panel" class="left-panel">
        <button type="button" id="btn-expand-strip" class="btn-expand-strip hidden" aria-label="expand"></button>
        <div class="zone zone-1">
          <div class="brand-row">
            <span class="logo">JT M&C Pte Ltd</span>
            <div class="zone1-right">
              <button type="button" id="btn-lang" class="btn-lang">EN</button>
              <span id="status" class="status hidden"></span>
            </div>
          </div>
        </div>
        <div class="zone zone-2" id="zone-featured">
          <div class="zone-label" data-i18n="featured">主推</div>
          <div id="featured-slot" class="featured-slot"></div>
          <button type="button" id="btn-feat-prev" class="icon-btn">‹</button>
          <button type="button" id="btn-feat-next" class="icon-btn icon-btn-next">›</button>
        </div>
        <div class="zone zone-3">
          <div class="zone-label" data-i18n="explore">选衣</div>
          <div id="cat-tabs" class="cat-tabs"></div>
          <div class="explore-wrap">
            <div id="explore-list" class="explore-list"></div>
            <div id="explore-scroll-hint" class="explore-scroll-hint" aria-hidden="true">∨</div>
          </div>
        </div>
        <div class="zone zone-session-done hidden" id="zone-session-done">
          <button type="button" id="btn-session-done" class="btn-session-done" data-i18n="done">完成</button>
        </div>
        <div class="zone zone-4" id="zone-shortlist">
          <div class="zone-label"><span data-i18n="shortlist">备选</span> <span id="shortlist-count">0</span></div>
          <div id="shortlist" class="shortlist"></div>
          <button type="button" id="btn-end-link" class="btn-end-link hidden" data-i18n="end_session">结束试穿</button>
        </div>
        <div class="zone-empty"></div>
      </aside>
      <button type="button" id="btn-return-dot" class="btn-return-dot hidden" aria-label="back"></button>
      <section class="right-panel">
        <button id="btn-end" class="btn-end hidden" data-i18n="end">结束</button>
        <button id="btn-change" class="btn-change hidden" data-i18n="change">换衣</button>
        <button type="button" id="btn-cam-toggle" class="btn-cam-toggle hidden" aria-label="camera"></button>
        <div id="camera-off-stage" class="camera-off-stage hidden" aria-hidden="true">
          <div class="cam-off-glass"></div>
          <div class="cam-off-mark">JT</div>
        </div>
        <button id="btn-save" class="btn-save hidden" data-i18n="add_shortlist">加入备选</button>
        <div id="api-credit-hint" class="api-credit-hint hidden" aria-hidden="true">
          <span class="api-credit-ring"></span>
          <span class="api-credit-core"></span>
        </div>
        <div id="video-placeholder" class="video-placeholder" data-i18n="placeholder"></div>
      </section>
    </div>
  </div>
  <div id="product-modal" class="modal hidden">
    <div class="modal-card">
      <img id="product-modal-img" alt="" />
      <div class="modal-name" id="product-modal-name"></div>
      <div id="modal-swatches" class="modal-swatches"></div>
      <div class="modal-actions">
        <button type="button" id="btn-modal-cancel" data-i18n="back">返回</button>
        <button type="button" id="btn-modal-shortlist" data-i18n="add_shortlist">加入备选</button>
        <button type="button" id="btn-modal-try" class="primary" data-i18n="try_on">试穿</button>
      </div>
    </div>
  </div>
  <div id="end-overlay" class="overlay hidden">
    <div class="overlay-card">
      <h3 data-i18n="session_title">本次试穿</h3>
      <p class="overlay-sub" data-i18n="session_thanks">感谢体验</p>
      <div id="end-tried" class="end-list"></div>
      <div id="end-shortlist-wrap" class="hidden">
        <h4 data-i18n="session_shortlist">你的备选</h4>
        <div id="end-shortlist" class="end-list end-list-clickable"></div>
      </div>
      <p class="overlay-hint" data-i18n="session_hint">画面将保留片刻</p>
      <button id="btn-end-close" class="primary" data-i18n="done">完成</button>
    </div>
  </div>
  <script type="module" src="./app.js"></script>
  <script type="module" src="./cabin-aspect-runtime.js"></script>
  <script src="./skip-attract.js"></script>
  <script src="./camera-quality.js?v=cam5"></script>
  <script src="./force-cam.js?v=cam5"></script>
</body>
</html>

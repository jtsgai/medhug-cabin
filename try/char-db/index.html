<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>MedHug 试用 · 功能 B · 二次元换装库</title>
  <style>
    :root { color-scheme: dark; --bg: #0d0f12; --ink: #f4efe6; --muted: #c5ccd4; --a: #7dd3fc; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
    body {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      height: 100%;
      overflow: hidden;
      font: 14px/1.45 "PingFang SC", -apple-system, BlinkMacSystemFont, ui-sans-serif, system-ui, sans-serif;
    }
    .banner {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      align-items: center;
      padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
      background: rgba(13, 15, 18, .94);
      border-bottom: 1px solid rgba(255, 255, 255, .08);
      color: var(--muted);
    }
    .banner strong { color: var(--ink); font-weight: 650; }
    .banner a { color: var(--a); text-decoration: none; }
    .banner a:hover { text-decoration: underline; }
    .frame {
      width: 100%;
      height: 100%;
      min-height: 0;
      border: 0;
      background: #fff;
    }
  </style>
</head>
<body>
  <header class="banner">
    <strong>试用入口</strong>
    <span>素材版权归原作者たき AI</span>
    <span>禁止再分发原图</span>
    <a href="/try/">返回 /try/</a>
    <a href="https://sleepyzone.online/char-db-cn/" target="_blank" rel="noopener noreferrer">新窗口打开原站</a>
  </header>
  <iframe
    class="frame"
    src="https://sleepyzone.online/char-db-cn/"
    title="二次元换装库 char-db-cn"
    referrerpolicy="no-referrer-when-downgrade"
  ></iframe>
</body>
</html>

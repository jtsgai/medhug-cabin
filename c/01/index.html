<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HaloCabin</title>
  <style>
    html, body { margin:0; height:100%; background:#000; color:#eee;
      font-family: -apple-system, sans-serif; }
    .box { min-height:100%; display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:16px; }
    input, button { font-size:18px; padding:12px 16px; border-radius:10px; }
    input { border:1px solid #444; background:#111; color:#fff; width:220px; }
    button { border:0; background:#ff7a18; color:#111; font-weight:700; }
    .err { color:#ff8a8a; min-height:1.2em; }
  </style>
</head>
<body>
  <form class="box" id="f">
    <div>HaloCabin</div>
    <input id="pin" type="password" inputmode="numeric" maxlength="16" placeholder="PIN" autofocus />
    <button type="submit">Enter</button>
    <div class="err" id="err"></div>
  </form>
  <script>
    var cabin = "cabin_01";
    document.getElementById("f").addEventListener("submit", async function (e) {
      e.preventDefault();
      var err = document.getElementById("err");
      err.textContent = "";
      var pin = document.getElementById("pin").value.trim();
      try {
        var r = await fetch("https://live.medhug.ai/api/cabin-login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ cabin: cabin, pin: pin })
        });
        var j = {};
        try { j = await r.json(); } catch (e2) {}
        if (!r.ok) { err.textContent = j.error || "PIN incorrect"; return; }
        document.cookie = "hc_cabin=" + encodeURIComponent(cabin) +
          "; Domain=.medhug.ai; Path=/; Max-Age=31536000; Secure; SameSite=Lax";
        try { localStorage.setItem("hc_cabin", cabin); } catch (e3) {}
        location.replace("/");
      } catch (e4) {
        err.textContent = "Network error";
      }
    });
  </script>
</body>
</html>

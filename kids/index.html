<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Kids L1</title>
  <link rel="stylesheet" href="./styles.css?v=kids5" />
  <link rel="stylesheet" href="./holo.css" />
  <link rel="stylesheet" href="../shared-dock.css" />
  <link rel="stylesheet" href="../ui-over-video.css?v=cam18" />
  <link rel="stylesheet" href="../phone-adapt.css?v=p3" />
</head>
<body class="kids-page">
  <video id="video-output" class="holo-video" autoplay playsinline muted></video>
  <nav class="jt-dock" id="jt-dock">
    <a href="../index.html">TRY ON</a>
    <a href="./" class="is-here">KIDS</a>
    <a href="../fx/">FX</a>
    <a href="../stage/">STAGE</a>
    <a href="../talk/">TALK</a>
  </nav>
  <div class="cabin">
    <header class="topbar">
      <div class="topbar-row">
        <img class="logo-text" src="./brand/文字logo.png" alt="Red Fun Planet" />
      </div>
      <h1 class="headline" id="headline">Perform with your favorite character</h1>
    </header>
    <div class="stage">
      <aside id="col-left" class="col col-left"></aside>
      <section class="stage-center">
        <div id="empty-state" class="empty-state">
          <button type="button" id="btn-logo-start" class="logo-hit">
            <img class="logo-3d pulse-always" src="./brand/logo_3d.png" alt="" />
          </button>
          <p class="empty-text" id="empty-text">Please choose your friend</p>
        </div>
        <div id="status" class="status hidden"></div>
        <button type="button" id="btn-stop" class="btn-stop hidden">Exit</button>
      </section>
      <aside id="col-right" class="col col-right"></aside>
    </div>
  </div>
  <div id="used-minutes" class="used-minutes hidden"></div>
  <div id="toast" class="toast hidden"></div>
  <script>try { window.speechSynthesis.cancel(); window.speechSynthesis.speak = function () {}; } catch (e) {}
  window.confirm = function () { return true; };</script>
  <script src="../usage-client.js"></script>
  <script src="../cam-gate.js?v=cam18"></script>
  <script type="module" src="./app.js?v=kids4"></script>
  <script src="./blank-exit.js"></script>
  <script src="../camera-quality.js?v=cam18"></script>
  <script src="../force-cam.js?v=cam18"></script>
  <script src="../cam-exit.js?v=cam18"></script>
  <script>
    async function refreshUsed() {
      const el = document.getElementById("used-minutes");
      if (!el) return;
      try {
        const r = await fetch("https://live.medhug.ai/api/cabin-owner", { credentials: "include" });
        if (!r.ok) return el.classList.add("hidden");
        const d = await r.json();
        el.textContent = "Used " + (d.used_minutes ?? d.tryon_minutes ?? 0) + " min";
        el.classList.remove("hidden");
      } catch { el.classList.add("hidden"); }
    }
    refreshUsed();
    setInterval(refreshUsed, 20000);
  </script>
  <script src="../gate.js"></script>
</body>
</html>
